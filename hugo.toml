baseURL = "https://yoursite.com/"
languageCode = "en-GB"
title = "Martin Barker"
theme  = "lumina"

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML"]
  page    = ["HTML"]

[imaging]
  quality        = 85
  resampleFilter = "lanczos"
  bgColor        = "#F8F7F4"

enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  author      = "Martin Barker"
  tagline     = "Photographer"
  description = "Photography portfolio"
  aboutPage   = "/about/"
  heroTitle    = "Selected Work"
  heroSubtitle = ""
  footerText  = ""
  blogEnabled  = true
  blogSubtitle = "Notes on photography, process, and place"  

[markup.goldmark.renderer]
  unsafe = true
