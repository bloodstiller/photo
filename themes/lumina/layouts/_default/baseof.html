<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ end }}">

  {{ partial "header.html" . }}

  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <!-- Lightbox Overlay -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lightbox__close" id="lightbox-close" aria-label="Close">&times;</button>
    <button class="lightbox__nav lightbox__prev" id="lightbox-prev" aria-label="Previous photo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="lightbox__stage">
      <img class="lightbox__img" id="lightbox-img" src="" alt="" />
      <p class="lightbox__caption" id="lightbox-caption"></p>
    </div>
    <button class="lightbox__nav lightbox__next" id="lightbox-next" aria-label="Next photo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <div class="lightbox__counter" id="lightbox-counter"></div>
  </div>

  {{ $js := resources.Get "js/main.js" | minify }}
  <script src="{{ $js.RelPermalink }}"></script>
</body>
</html>
